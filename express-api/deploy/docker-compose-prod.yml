services:
  fastify-api:
    image: "fra.vultrcr.com/crvikfandfrankfurt/mpn-fastify-app:latest"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: 0.1
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20${OTEL_AUTH_TOKEN}"
      STAGE: prod
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "node", "healthcheck.cjs"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.api-mpn_prod.rule=Host(`${API_DOMAIN}`)
        - traefik.http.routers.api-mpn_prod.entrypoints=https
        - traefik.http.routers.api-mpn_prod.tls.certresolver=letsencrypt
        - traefik.http.services.api-mpn_prod.loadbalancer.server.port=3000
        - KUMA.mpnprodgroup.group.name=Mpn Prod
        - KUMA.mpnfastifyprod.http.name=Fastify Prod
        - KUMA.mpnfastifyprod.http.parent_name=mpnprodgroup
        - KUMA.mpnfastifyprod.http.url=https://${API_DOMAIN}/healthz
    labels:
      logging.promtail.enabled: false
      service.name: ${OTEL_SERVICE_NAME}
      service.namespace: "mpn"
      service.version: ${GIT_COMMIT}
      deployment.environment: ${STAGE}

networks:
  traefik-public:
    external: true
    name: traefik-public
