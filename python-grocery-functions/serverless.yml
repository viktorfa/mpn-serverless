org: matpanett
app: python-sls-function
# Welcome to Serverless!
#
# This file is the main config file for your service.
# It's very minimal at this point and uses default values.
# You can always add more config options for more control.
# We've included some commented out config examples here.
# Just uncomment any of them to get that config option.
#
# For full config options, check the docs:
#    docs.serverless.com
#
# Happy Coding!

service: python-mpn-functions # NOTE: update this with your service name
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: python3.11
  region: eu-central-1
  logRetentionInDays: ${self:custom.logRetentionInDays.${sls:stage}, self:custom.logRetentionInDays.other}
  profile: serverless-mpn-admin
  versionFunctions: false

  memorySize: 1024
  timeout: 30

  layers:
    - !Ref CommonLambdaLayer

  environment:
    STAGE: ${sls:stage}
    SCRAPER_FEED_BUCKET: !Ref ScraperFeedBucket
    HANDLE_SCRAPER_FEED_FUNCTION_NAME: "${self:service}-${sls:stage}-scraperFeedWithConfigTrigger"
    POSTGRES_URL: "${env:POSTGRES_URL}"

    # For message broker
    REDIS_HOST: ${env:LAMBDA_REDIS_HOST}
    REDIS_PASSWORD: ${env:LAMBDA_REDIS_PASSWORD}
    DRAMATIQ_NAMESPACE: ${env:DRAMATIQ_NAMESPACE}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - "lambda:InvokeFunction"
      Resource:
        - "arn:aws:lambda:#{AWS::Region}:#{AWS::AccountId}:function:mpn-crawler-${sls:stage}-scrape"
    - Effect: "Allow"
      Action:
        - "s3:GetObject"
        - "s3:GetObjectVersion"
      Resource: !Sub
        - "arn:aws:s3:::#{BucketName}/*"
        - BucketName:
            Ref: ScraperFeedBucket
    - Effect: "Allow"
      Action:
        - "s3:ListBucketVersions"
        - "s3:GetBucketVersioning"
      Resource: !Sub
        - "arn:aws:s3:::#{BucketName}"
        - BucketName:
            Ref: ScraperFeedBucket
    - Effect: "Allow"
      Action:
        - "sns:Publish"
      Resource: !Ref ScraperFeedHandledTopic
    - Effect: "Allow"
      Action:
        - "sns:Publish"
      Resource: !Ref PricingFeedHandledTopic
    - Effect: "Allow"
      Action:
        - "sns:Publish"
      Resource: !Ref BookFeedHandledTopic

package:
  artifact: serverless_artifact.zip

functions:
  scraperFeedSns:
    handler: scraper_feed.scraper_handler.scraper_feed_sns
    events:
      - sns:
          topicName: ScraperFeedCreated
          arn:
            Ref: ScraperFeedCreatedTopic
    timeout: 12
  scraperFeedTrigger:
    handler: scraper_feed.scraper_handler.trigger_scraper_feed

  handleHttpOptions:
    handler: scraper_management.handler.handle_options
    timeout: 30
    events:
      - http:
          path: "{proxy+}"
          method: options
  invokeScrapeHttp:
    timeout: 30
    environment:
      SCRAPE_FUNCTION_NAME: mpn-crawler-${sls:stage}-scrape
    handler: scraper_management.handler.handle_scrape
    events:
      - http:
          path: scrape/{id}
          method: post
  invokeHandleHttp:
    timeout: 30
    environment:
      SCRAPE_FUNCTION_NAME: mpn-crawler-${sls:stage}-handle
    handler: scraper_management.handler.handle_feed
    events:
      - http:
          path: handle/{id}
          method: post

  updatePageviews:
    handler: scraper_feed.google_anal.pageviews.handle_ga4
    timeout: 120
    events:
      - schedule:
          rate: rate(12 hours)
          enabled: true
          description: "Every twelve hours"

  updateDenormalizedProducts:
    handler: storage.postgres.denormalized_products.update_denormalized_products_for_valid_offers
    timeout: 450
    events:
      - schedule:
          rate: rate(24 hours)
          enabled: true
          description: "Every 24 hours"

resources:
  - ${file(../s3-sns-cloudformation.yml)}

plugins:
  - serverless-cloudformation-sub-variables
  - serverless-offline

custom:
  logRetentionInDays:
    prod: 30
    other: 1

layers:
  common:
    path: layer/common
