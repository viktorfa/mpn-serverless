[project]
name = "python-grocery-functions"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Viktor Andersen", email = "vikfand@gmail.com"},
]
dependencies = [
    "pymongo==4.8.0",
    "pydash==8.0.3",
    "python-dotenv==1.0.1",
    "dnspython==2.6.1",
    "sentry-sdk==1.26.0",
    "google-api-python-client==2.91.0",
    "oauth2client==4.1.3",
    "bleach==3.3.0",
    "python-slugify>=8.0.4",
    "urllib3<2",
    "gtin==1.3.1649173518",
    "google-analytics-data==0.18.10",
    "ijson>=3.3.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "uuid7>=0.1.0",
    "pydantic>=2.9.2",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "botostubs>=0.15.1.23.10",
    "boto3>=1.35.20",
    "pytest>=8.3.3",
]

[tool.pdm.scripts]
test = "pytest"
