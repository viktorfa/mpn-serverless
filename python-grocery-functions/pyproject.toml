[project]
name = "python-grocery-functions"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Viktor Andersen", email = "vikfand@gmail.com"},
]
dependencies = [
    "pymongo~=4.8.0",
    "pydash~=8.0.0",
    "python-dotenv~=1.0.0",
    "dnspython~=2.6.0",
    "sentry-sdk~=1.26.0",
    "google-api-python-client~=2.91.0",
    "oauth2client~=4.1.0",
    "bleach~=3.3.0",
    "python-slugify~=8.0.0",
    "urllib3~=1.26",
    "gtin~=1.3.0",
    "google-analytics-data~=0.18.0",
    "ijson~=3.3.0",
    "sqlalchemy~=2.0.0",
    "psycopg2-binary~=2.9.0",
    "uuid7~=0.1.0",
    "pydantic~=2.9.0",
    "dramatiq[redis,watch]~=1.17.0",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[dependency-groups]
dev = [
    "botostubs~=0.15.0",
    "boto3~=1.35.0",
    "pytest~=8.3.0",
]
